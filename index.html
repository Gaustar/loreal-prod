<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>L'Oréal - Suivi Production</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
    <h1>L'ORÉAL</h1>
    <p>Suivi de Production</p>
</div>

<div class="tabs" id="tabs-container"></div>
<div id="contents-container"></div>

<div class="footer">
    Programme fait maison 🛠️<br>
    <span style="font-size: 11px; color: #ccc;">Bon courage ! 💪</span>
</div>

<!-- Bouton flottant pour le minuteur de shift (bas gauche) -->
<div class="fab fab-timer" onclick="ouvrirTimerShift()">⏱️</div>

<!-- Bouton flottant pour avis (bas droite) -->
<div class="fab fab-avis" onclick="ouvrirAvis()">💬</div>

<!-- Bouton flottant pour le contrôle qualité (bas centre) : affiche le décompte
     de la ligne actuellement affichée, tap = valider le contrôle -->
<div class="fab fab-controle" id="fab-controle">🕐</div>

<!-- Modal Réglages (unifié : cadence, seuil cuve, contrôle qualité, file d'attente) -->
<div class="modal-overlay" id="modal-reglages">
    <div class="modal-box modal-box-large">
        <h3 id="modal-reglages-title">⚙️ Réglages</h3>

        <div class="reglages-section">
            <div class="reglages-section-titre">🔩 Cadence</div>
            <div class="form-group" style="margin-bottom: 8px;">
                <label class="form-label">Pièces par minute :</label>
                <input type="number" id="input-cadence" class="form-input" style="font-size: 22px; text-align: center;" min="1" step="1">
            </div>
            <button class="modal-reset-btn" onclick="resetCadenceReglages()">Rétablir la valeur par défaut</button>
        </div>

        <div class="reglages-section" id="groupe-seuil-cuve" style="display: none;">
            <div class="reglages-section-titre">🧪 Seuil cuve</div>
            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label">Seuil minimum (kg) :</label>
                <input type="number" id="input-seuil-cuve" class="form-input" style="font-size: 20px; text-align: center;" min="0" step="1">
            </div>
        </div>

        <div class="reglages-section">
            <div class="reglages-section-titre">🕐 Contrôle qualité</div>
            <div class="form-group" style="margin-bottom: 8px;">
                <label class="form-label">Heure de référence (répétée toutes les heures) :</label>
                <input type="time" id="input-controle-heure" class="form-input" style="font-size: 20px; text-align: center;">
            </div>
            <button class="modal-reset-btn" onclick="resetControleReglages()">Désactiver le contrôle</button>
        </div>

        <div class="reglages-section">
            <div class="reglages-section-titre">📋 File d'attente (<span id="commandes-count">0</span>)</div>
            <div id="commandes-liste"></div>
            <div class="commande-ajout">
                <input type="number" id="input-nouvelle-commande" class="form-input" placeholder="Quantité" min="1" step="1">
                <button class="btn-ajout-commande" onclick="ajouterCommande(ligneReglages)">➕</button>
            </div>
            <button class="btn-commande-suivante" onclick="commandeSuivante(ligneReglages)">▶ Commande suivante</button>
        </div>

        <div class="button-group" style="grid-template-columns: 1fr 1fr; margin-bottom: 0; margin-top: 10px;">
            <button class="btn btn-reset" style="grid-column: span 1; margin-top: 0;" onclick="fermerReglagesLigne()">Fermer</button>
            <button class="btn btn-ajouter" style="grid-column: span 1;" onclick="validerReglagesLigne()">Valider</button>
        </div>
    </div>
</div>

<!-- Modal Timer de Shift -->
<div class="modal-overlay" id="modal-shift">
    <div class="shift-modal-box">
        <div class="shift-selector">
            <button id="btn-shift-matin" onclick="choisirShift('matin')">☀️ Matin</button>
            <button id="btn-shift-aprem" onclick="choisirShift('aprem')">🌤️ Après-m</button>
        </div>
        <div class="shift-label" id="shift-label">CHARGEMENT...</div>
        <div class="shift-countdown" id="shift-countdown">--:--:--</div>
        <div class="shift-progress-bar"><div class="shift-progress-fill" id="shift-progress-fill"></div></div>
        <div class="shift-meta" id="shift-progress-text">0% du shift effectué</div>
        <div class="shift-meta" id="shift-end-time" style="margin-top: 10px; color: #C5A028; font-weight: bold;">Fin à --h--</div>
        <div class="repas-section">
            <label class="repas-toggle">
                <span>🍴 Timer repas</span>
                <input type="checkbox" id="repas-actif" onchange="toggleRepas()">
                <div class="repas-switch"></div>
            </label>
            <div class="repas-config" id="repas-config">
                <input type="time" id="repas-heure" class="repas-time-input" onchange="sauverHeureRepas()">
                <div class="repas-countdown" id="repas-countdown">--:--:--</div>
                <div class="repas-label-small" id="repas-label">avant la pause</div>
            </div>
        </div>
        <button class="shift-close-btn" onclick="fermerTimerShift()">Fermer</button>
    </div>
</div>

<!--
    Ordre de chargement important : chaque fichier dépend des constantes/fonctions
    définies dans les précédents (pas de bundler, scripts classiques).
-->
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/cadence.js"></script>
<script src="js/poste.js"></script>
<script src="js/calcul-lignes.js"></script>
<script src="js/commandes.js"></script>
<script src="js/shift-timer.js"></script>
<script src="js/controle-qualite.js"></script>
<script src="js/reglages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
