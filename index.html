<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>L'Oréal - Suivi Production</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f5f5f5; min-height: 100vh; color: #333; }
        .header { background: #000; color: white; padding: 20px; text-align: center; }
        .tabs { display: flex; background: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex-wrap: wrap; }
        .tab { flex: 1; min-width: 100px; padding: 15px; text-align: center; font-weight: bold; border: none; background: #eee; cursor: pointer; color: #666; transition: 0.3s; }
        .tab.active { background: white; color: #000; }
        .tab.active.l60 { border-bottom: 4px solid #2ecc71; }
        .tab.active.l70 { border-bottom: 4px solid #9b59b6; }
        .tab.active.l74 { border-bottom: 4px solid #e67e22; }
        .tab.active.l87 { border-bottom: 4px solid #3498db; }
        .content { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .ligne-header { border-radius: 15px; padding: 20px; color: white; text-align: center; margin-bottom: 15px; }
        .ligne-header.l60 { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .ligne-header.l70 { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .ligne-header.l74 { background: linear-gradient(135deg, #e67e22, #d35400); }
        .ligne-header.l87 { background: linear-gradient(135deg, #3498db, #2980b9); }
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .progress-bar { width: 100%; height: 30px; background: #e0e0e0; border-radius: 15px; overflow: hidden; position: relative; margin-top: 10px; }
        .progress-fill { height: 100%; background: #2ecc71; width: 0%; transition: width 0.5s ease-out; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 13px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .form-input { width: 100%; padding: 15px; font-size: 20px; border: 2px solid #ddd; border-radius: 10px; appearance: none; }
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .btn { padding: 18px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.97); }
        .btn-retirer { background: #e67e22; }
        .btn-ajouter { background: #3498db; }
        .btn-calculer { background: #2ecc71; grid-column: span 2; font-size: 18px; }
        .btn-reset { background: #e74c3c; grid-column: span 2; margin-top: 5px; opacity: 0.9; }
        .btn-avis { background: #9b59b6; margin-top: 20px; width: 100%; }
        .resultat-section { margin-top: 15px; padding: 15px; background: #f9f9f9; border-left: 5px solid #3498db; border-radius: 8px; }
        .resultat-title { font-weight: bold; color: #7f8c8d; font-size: 13px; text-transform: uppercase; }
        .resultat-highlight { font-size: 26px; font-weight: bold; margin: 5px 0; color: #2c3e50; }
        .error { color: #e74c3c; font-weight: bold; text-align: center; }
        .success { color: #27ae60; font-weight: bold; text-align: center; font-size: 22px; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>L'ORÉAL</h1>
        <p>Suivi de Production</p>
    </div>

    <div class="tabs">
        <button class="tab l60 active" onclick="switchTab('l60')">L60-61-65</button>
        <button class="tab l70" onclick="switchTab('l70')">L70</button>
        <button class="tab l74" onclick="switchTab('l74')">L74</button>
        <button class="tab l87" onclick="switchTab('l87')">L87</button>
    </div>

    <div id="l60" class="content active">
        <div class="ligne-header l60"><h2>Ligne Excellence</h2></div>
        <div class="card">
            <div id="progress-text-l60">Progression: 0%</div>
            <div class="progress-bar"><div id="progress-fill-l60" class="progress-fill"></div></div>
        </div>
        <div class="card">
            <div class="form-group">
                <label class="form-label">Quantité totale à produire :</label>
                <input type="number" id="total-l60" class="form-input" placeholder="0" min="1" step="1">
            </div>
            <div class="form-group">
                <label class="form-label">Déjà produit :</label>
                <input type="number" id="fait-l60" class="form-input" value="0" min="0" step="1">
            </div>
            <div class="button-group">
                <button class="btn btn-retirer" onclick="modifierPalette('l60', -1)">➖ PALETTE</button>
                <button class="btn btn-ajouter" onclick="modifierPalette('l60', 1)">➕ PALETTE</button>
                <button class="btn btn-calculer" onclick="calculer('l60')">CALCULER</button>
                <button class="btn btn-reset" onclick="reinitialiser('l60')">RÉINITIALISER</button>
            </div>
        </div>
        <div id="resultat-l60"></div>
    </div>

    <div id="l70" class="content">
        <div class="ligne-header l70"><h2>Ligne L70</h2></div>
        <div class="card">
            <div id="progress-text-l70">Progression: 0%</div>
            <div class="progress-bar"><div id="progress-fill-l70" class="progress-fill"></div></div>
        </div>
        <div class="card">
            <div class="form-group">
                <label class="form-label">Quantité totale à produire :</label>
                <input type="number" id="total-l70" class="form-input" placeholder="0" min="1" step="1">
            </div>
            <div class="form-group">
                <label class="form-label">Déjà produit :</label>
                <input type="number" id="fait-l70" class="form-input" value="0" min="0" step="1">
            </div>
            <div class="button-group">
                <button class="btn btn-retirer" onclick="modifierPalette('l70', -1)">➖ PALETTE</button>
                <button class="btn btn-ajouter" onclick="modifierPalette('l70', 1)">➕ PALETTE</button>
                <button class="btn btn-calculer" onclick="calculer('l70')">CALCULER</button>
                <button class="btn btn-reset" onclick="reinitialiser('l70')">RÉINITIALISER</button>
            </div>
        </div>
        <div id="resultat-l70"></div>
    </div>

    <div id="l74" class="content">
        <div class="ligne-header l74"><h2>Ligne L74</h2></div>
        <div class="card">
            <div id="progress-text-l74">Progression: 0%</div>
            <div class="progress-bar"><div id="progress-fill-l74" class="progress-fill"></div></div>
        </div>
        <div class="card">
            <div class="form-group">
                <label class="form-label">Quantité totale à produire :</label>
                <input type="number" id="total-l74" class="form-input" placeholder="0" min="1" step="1">
            </div>
            <div class="form-group">
                <label class="form-label">Déjà produit :</label>
                <input type="number" id="fait-l74" class="form-input" value="0" min="0" step="1">
            </div>
            <div class="button-group">
                <button class="btn btn-retirer" onclick="modifierPalette('l74', -1)">➖ PALETTE</button>
                <button class="btn btn-ajouter" onclick="modifierPalette('l74', 1)">➕ PALETTE</button>
                <button class="btn btn-calculer" onclick="calculer('l74')">CALCULER</button>
                <button class="btn btn-reset" onclick="reinitialiser('l74')">RÉINITIALISER</button>
            </div>
        </div>
        <div id="resultat-l74"></div>
    </div>

    <div id="l87" class="content">
        <div class="ligne-header l87"><h2>Ligne L87</h2></div>
        <div class="card">
            <div id="progress-text-l87">Progression: 0%</div>
            <div class="progress-bar"><div id="progress-fill-l87" class="progress-fill"></div></div>
        </div>
        <div class="card">
            <div class="form-group">
                <label class="form-label">Quantité totale à produire :</label>
                <input type="number" id="total-l87" class="form-input" placeholder="0" min="1" step="1">
            </div>
            <div class="form-group">
                <label class="form-label">Déjà produit :</label>
                <input type="number" id="fait-l87" class="form-input" value="0" min="0" step="1">
            </div>
            <div class="button-group">
                <button class="btn btn-retirer" onclick="modifierPalette('l87', -1)">➖ PALETTE</button>
                <button class="btn btn-ajouter" onclick="modifierPalette('l87', 1)">➕ PALETTE</button>
                <button class="btn btn-calculer" onclick="calculer('l87')">CALCULER</button>
                <button class="btn btn-reset" onclick="reinitialiser('l87')">RÉINITIALISER</button>
            </div>
        </div>
        <div id="resultat-l87"></div>
    </div>

    <div class="card" style="text-align: center;">
        <button class="btn btn-avis" onclick="ouvrirAvis()">📝 Donner mon avis</button>
        <p style="font-size: 12px; color: #999; margin-top: 10px;">Vos retours m'aident à améliorer l'outil</p>
    </div>

    <script>
        const LIGNES = {
            l60: {
                produitsParPalette: 720,
                produitsParNiveau: 120,
                produitsParBoite: 6,
                vitesse: 85,
                colorant: 35
            },
            l70: {
                produitsParPalette: 828,
                produitsParNiveau: 138,
                produitsParBoite: 6,
                vitesse: 150
            },
            l74: {
                produitsParPalette: 828,
                produitsParNiveau: 138,
                produitsParBoite: 6,
                vitesse: 130
            },
            l87: {
                produitsParPalette: 1920,
                produitsParNiveau: 384,
                produitsParBoite: 6,
                vitesse: 75
            }
        };

        // ========== FONCTIONS DE SAUVEGARDE localStorage ==========

        function sauvegarderValeur(ligne, champ, valeur) {
            const cle = `${ligne}-${champ}`;
            localStorage.setItem(cle, valeur);
        }

        function chargerValeur(ligne, champ, valeurParDefaut = '') {
            const cle = `${ligne}-${champ}`;
            const sauvegarde = localStorage.getItem(cle);
            return sauvegarde !== null ? sauvegarde : valeurParDefaut;
        }

        function sauvegarderToutesLesDonnees() {
            const lignes = ['l60', 'l70', 'l74', 'l87'];
            for (const ligne of lignes) {
                const totalInput = document.getElementById(`total-${ligne}`);
                const faitInput = document.getElementById(`fait-${ligne}`);
                if (totalInput) sauvegarderValeur(ligne, 'total', totalInput.value);
                if (faitInput) sauvegarderValeur(ligne, 'fait', faitInput.value);
            }
        }

        function chargerToutesLesDonnees() {
            const lignes = ['l60', 'l70', 'l74', 'l87'];
            for (const ligne of lignes) {
                const totalInput = document.getElementById(`total-${ligne}`);
                const faitInput = document.getElementById(`fait-${ligne}`);
                if (totalInput) totalInput.value = chargerValeur(ligne, 'total', '');
                if (faitInput) faitInput.value = chargerValeur(ligne, 'fait', '0');
            }
        }

        function effacerSauvegardeLigne(ligne) {
            localStorage.removeItem(`${ligne}-total`);
            localStorage.removeItem(`${ligne}-fait`);
        }

        // ========== FONCTIONS PRINCIPALES ==========

        function switchTab(ligne) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelector('.tab.' + ligne).classList.add('active');
            document.getElementById(ligne).classList.add('active');
        }

        function modifierPalette(ligne, direction) {
            const input = document.getElementById('fait-' + ligne);
            let val = parseInt(input.value || 0);
            if (isNaN(val)) val = 0;
            const modif = LIGNES[ligne].produitsParPalette * direction;
            input.value = Math.max(0, val + modif);
            sauvegarderValeur(ligne, 'fait', input.value);
            calculer(ligne);
        }

        function calculer(ligne) {
            let total = parseInt(document.getElementById('total-' + ligne).value) || 0;
            let fait = parseInt(document.getElementById('fait-' + ligne).value) || 0;
            if (total < 0) total = 0;
            if (fait < 0) fait = 0;

            // Sauvegarde automatique à chaque calcul
            sauvegarderValeur(ligne, 'total', total);
            sauvegarderValeur(ligne, 'fait', fait);

            if (ligne === 'l60') {
                const reste = Math.max(0, total - fait);
                const pourcent = total > 0 ? Math.min(100, (fait / total) * 100) : 0;
                document.getElementById('progress-text-l60').innerText = `Progression: ${pourcent.toFixed(1)}%`;
                const fill = document.getElementById('progress-fill-l60');
                fill.style.width = pourcent + '%';
                fill.innerText = pourcent > 15 ? fait.toLocaleString() : '';
                const resDiv = document.getElementById('resultat-l60');
                if (total <= 0) {
                    resDiv.innerHTML = '<div class="card error">⚠️ Veuillez indiquer le total à produire</div>';
                    return;
                }
                if (reste === 0) {
                    resDiv.innerHTML = '<div class="card success">✅ PRODUCTION TERMINÉE</div>';
                    return;
                }
                const tubesLaminesParBoite = 252;
                const nbBoitesLam = Math.round(reste / tubesLaminesParBoite);
                const capaciteLam = nbBoitesLam * tubesLaminesParBoite;
                const tubesPlastiqueParBoite = 690;
                const nbBoitesPlast = Math.ceil(reste / tubesPlastiqueParBoite);
                const capacitePlast = nbBoitesPlast * tubesPlastiqueParBoite;
                const minTotales = reste / (LIGNES.l60.vitesse || 85);
                const h = Math.floor(minTotales / 60);
                const m = Math.floor(minTotales % 60);
                const fin = new Date(Date.now() + minTotales * 60000).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                let html = `
                    <div class="card">
                        <div class="resultat-section">
                            <div class="resultat-title">Reste à produire</div>
                            <div class="resultat-highlight">${reste.toLocaleString()} pièces</div>
                        </div>
                        <div class="resultat-section" style="border-left-color: #e67e22">
                            <div class="resultat-title">Boîtes de tubes laminés (${tubesLaminesParBoite} tubes/boîte)</div>
                            <div class="resultat-highlight" style="color:#e67e22">${nbBoitesLam} boîtes</div>
                            <div class="resultat-text">Capacité la plus proche : <strong>${capaciteLam.toLocaleString()} tubes</strong></div>
                        </div>
                        <div class="resultat-section" style="border-left-color: #3498db">
                            <div class="resultat-title">Boîtes de tubes plastique (${tubesPlastiqueParBoite} tubes/boîte)</div>
                            <div class="resultat-highlight" style="color:#3498db">${nbBoitesPlast} boîtes</div>
                            <div class="resultat-text">Capacité sécuritaire : <strong>${capacitePlast.toLocaleString()} tubes</strong> (un peu plus autorisé)</div>
                        </div>
                        <div class="resultat-section" style="border-left-color: #9b59b6">
                            <div class="resultat-title">Temps restant estimé</div>
                            <div class="resultat-highlight" style="color:#9b59b6">${h}h ${m}min</div>
                            <div class="resultat-text">Fin de prod prévue à : <strong>${fin}</strong></div>
                            <div class="resultat-text">Cadence : <strong>85 pièces/min</strong></div>
                        </div>`;
                if (LIGNES.l60.colorant) {
                    const col = (reste / LIGNES.l60.produitsParPalette * LIGNES.l60.colorant).toFixed(1);
                    html += `
                        <div class="resultat-section" style="border-left-color: #f1c40f">
                            <div class="resultat-title">Colorant nécessaire</div>
                            <div class="resultat-highlight" style="color:#e67e22">${col} kg</div>
                        </div>`;
                }
                html += `</div>`;
                resDiv.innerHTML = html;
                return;
            }

            const config = LIGNES[ligne];
            const reste = Math.max(0, total - fait);
            const pourcent = total > 0 ? Math.min(100, (fait / total * 100)) : 0;
            document.getElementById('progress-text-' + ligne).innerText = `Progression: ${pourcent.toFixed(1)}%`;
            const fill = document.getElementById('progress-fill-' + ligne);
            fill.style.width = pourcent + '%';
            fill.innerText = pourcent > 15 ? fait.toLocaleString() : '';
            if (total <= 0) {
                document.getElementById('resultat-' + ligne).innerHTML = '<div class="card error">⚠️ Veuillez indiquer le total à produire</div>';
                return;
            }
            if (fait >= total) {
                document.getElementById('resultat-' + ligne).innerHTML = '<div class="card success">✅ PRODUCTION TERMINÉE</div>';
                return;
            }
            const pal = Math.floor(reste / config.produitsParPalette);
            const resteP = reste % config.produitsParPalette;
            const niv = Math.floor(resteP / config.produitsParNiveau);
            const boit = Math.ceil((resteP % config.produitsParNiveau) / config.produitsParBoite);
            const minTotales = reste / config.vitesse;
            const h = Math.floor(minTotales / 60);
            const m = Math.floor(minTotales % 60);
            const fin = new Date(Date.now() + minTotales * 60000).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            let html = `
                <div class="card">
                    <div class="resultat-section">
                        <div class="resultat-title">Reste à produire</div>
                        <div class="resultat-highlight">${reste.toLocaleString()} pces</div>
                    </div>
                    <div class="resultat-section" style="border-left-color: #f1c40f">
                        <div class="resultat-title">Conditionnement</div>
                        <div class="resultat-text">
                            • <strong>${pal}</strong> palettes complètes<br>
                            • <strong>${niv}</strong> niveaux + <strong>${boit}</strong> boîtes
                        </div>
                    </div>
                    <div class="resultat-section" style="border-left-color: #9b59b6">
                        <div class="resultat-title">Temps restant estimé</div>
                        <div class="resultat-highlight" style="color:#9b59b6">${h}h ${m}min</div>
                        <div class="resultat-text">Fin de prod prévue à : <strong>${fin}</strong></div>
                    </div>`;
            if (config.colorant) {
                const col = (reste / config.produitsParPalette * config.colorant).toFixed(1);
                html += `
                    <div class="resultat-section" style="border-left-color: #e67e22">
                        <div class="resultat-title">Colorant nécessaire</div>
                        <div class="resultat-highlight" style="color:#e67e22">${col} kg</div>
                    </div>`;
            }
            html += `</div>`;
            document.getElementById('resultat-' + ligne).innerHTML = html;
        }

        function reinitialiser(ligne) {
            document.getElementById('total-' + ligne).value = '';
            document.getElementById('fait-' + ligne).value = '0';
            document.getElementById('resultat-' + ligne).innerHTML = '';
            const fill = document.getElementById('progress-fill-' + ligne);
            fill.style.width = '0%';
            fill.innerText = '';
            document.getElementById('progress-text-' + ligne).innerText = 'Progression: 0%';
            
            // Efface la sauvegarde pour cette ligne
            effacerSauvegardeLigne(ligne);
        }

        function ouvrirAvis() {
            window.open('https://docs.google.com/forms/d/e/1FAIpQLSft9tV_WZysn_8iuCZ3agsb_NX4DImhX0hkei1P39CXv7Byug/viewform?usp=dialog', '_blank');
        }

        // ========== INITIALISATION AU CHARGEMENT ==========
        
        // 1. Charger les données sauvegardées
        chargerToutesLesDonnees();

        // 2. Ajouter des écouteurs d'événements pour sauvegarde automatique
        const lignes = ['l60', 'l70', 'l74', 'l87'];
        for (const ligne of lignes) {
            const totalInput = document.getElementById(`total-${ligne}`);
            const faitInput = document.getElementById(`fait-${ligne}`);
            
            if (totalInput) {
                totalInput.addEventListener('input', function() {
                    sauvegarderValeur(ligne, 'total', this.value);
                    calculer(ligne);
                });
            }
            if (faitInput) {
                faitInput.addEventListener('input', function() {
                    sauvegarderValeur(ligne, 'fait', this.value);
                    calculer(ligne);
                });
            }
        }

        // 3. Lancer le calcul initial pour chaque ligne (afficher les résultats)
        for (const ligne of lignes) {
            calculer(ligne);
        }
    </script>
</body>
</html>
