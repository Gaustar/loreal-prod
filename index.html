<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>L'Oréal - Suivi Production</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
    <h1>L'ORÉAL</h1>
    <p>Suivi de Production</p>
</div>

<div class="tabs" id="tabs-container"></div>
<div id="contents-container"></div>

<div class="footer">
    Programme fait maison 🛠️<br>
    <span style="font-size: 11px; color: #ccc;">Bon courage ! 💪</span>
</div>

<!-- Bouton flottant pour le minuteur de shift (bas gauche) -->
<div class="fab fab-timer" onclick="ouvrirTimerShift()">⏱️</div>

<!-- Bouton flottant pour avis (bas droite) -->
<div class="fab fab-avis" onclick="ouvrirAvis()">💬</div>

<!-- Modal Réglage Cadence -->
<div class="modal-overlay" id="modal-cadence">
    <div class="modal-box">
        <h3 id="modal-cadence-title">🔩 Cadence</h3>
        <div class="form-group" style="margin-bottom: 15px;">
            <label class="form-label">Pièces par minute :</label>
            <input type="number" id="input-cadence" class="form-input" style="font-size: 24px; text-align: center;" min="1" step="1">
        </div>
        <div class="button-group" style="grid-template-columns: 1fr 1fr; margin-bottom: 0;">
            <button class="btn btn-reset" style="grid-column: span 1; margin-top: 0;" onclick="fermerReglageCadence()">Annuler</button>
            <button class="btn btn-ajouter" style="grid-column: span 1;" onclick="sauverCadence()">Valider</button>
        </div>
        <button class="modal-reset-btn" onclick="resetCadence()">Rétablir la valeur par défaut</button>
    </div>
</div>

<!-- Modal Timer de Shift -->
<div class="modal-overlay" id="modal-shift">
    <div class="shift-modal-box">
        <div class="shift-selector">
            <button id="btn-shift-matin" onclick="choisirShift('matin')">☀️ Matin</button>
            <button id="btn-shift-aprem" onclick="choisirShift('aprem')">🌤️ Après-m</button>
        </div>
        <div class="shift-label" id="shift-label">CHARGEMENT...</div>
        <div class="shift-countdown" id="shift-countdown">--:--:--</div>
        <div class="shift-progress-bar"><div class="shift-progress-fill" id="shift-progress-fill"></div></div>
        <div class="shift-meta" id="shift-progress-text">0% du shift effectué</div>
        <div class="shift-meta" id="shift-end-time" style="margin-top: 10px; color: #C5A028; font-weight: bold;">Fin à --h--</div>
        <div class="repas-section">
            <label class="repas-toggle">
                <span>🍴 Timer repas</span>
                <input type="checkbox" id="repas-actif" onchange="toggleRepas()">
                <div class="repas-switch"></div>
            </label>
            <div class="repas-config" id="repas-config">
                <input type="time" id="repas-heure" class="repas-time-input" onchange="sauverHeureRepas()">
                <div class="repas-countdown" id="repas-countdown">--:--:--</div>
                <div class="repas-label-small" id="repas-label">avant la pause</div>
            </div>
        </div>
        <button class="shift-close-btn" onclick="fermerTimerShift()">Fermer</button>
    </div>
</div>

<!--
    Ordre de chargement important : chaque fichier dépend des constantes/fonctions
    définies dans les précédents (pas de bundler, scripts classiques).
-->
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/cadence.js"></script>
<script src="js/poste.js"></script>
<script src="js/calcul-lignes.js"></script>
<script src="js/shift-timer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
